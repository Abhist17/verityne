name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # requirements.txt pins torch/torchvision with a +cu124 local tag, which
      # only resolves against the PyTorch CUDA index. CI has no GPU, so the two
      # lines are dropped and the same versions are pulled from the CPU index.
      # No second requirements file to drift out of sync.
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch==2.6.0 torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)==' backend/requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt pytest

      - name: Run pytest
        env:
          PYTHONPATH: backend
          VERITYNE_DEVICE: cpu
          VERITYNE_WARMUP: "0"
        run: pytest backend/tests -q

  frontend:
    name: dashboard typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
